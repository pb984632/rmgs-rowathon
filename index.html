<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGS Rowathon</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#12263a;--mute:#5b6f82;--sea:#cfe6f5;--land:#e9e3d3;--line:#d3dbe3;--acc:#e4572e;--done:#1a7f5a;--be:#efe0b8;--nl:#e8d3c8;--uk:#dfe6d0;--de:#dde3ec;--lu:#ead9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#15263a;--ink:#e8eff6;--mute:#93a7ba;--sea:#12324a;--land:#2a3a44;--line:#27405a;--acc:#ff7a4d;--done:#3fcf9a;--be:#3a3a2a;--nl:#3d2f36;--uk:#2a3d38;--de:#2f3340;--lu:#3a2f40}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#15263a;--ink:#e8eff6;--mute:#93a7ba;--sea:#12324a;--land:#2a3a44;--line:#27405a;--acc:#ff7a4d;--done:#3fcf9a;--be:#3a3a2a;--nl:#3d2f36;--uk:#2a3d38;--de:#2f3340;--lu:#3a2f40}
*{box-sizing:border-box}
:root:root:root{color-scheme:dark;--bg:#1c2228;--card:#283139;--ink:#f2f4f6;--mute:#9aa6b0;--sea:#161b20;--land:#34404a;--line:#3b4751;--acc:#e31c0e;--done:#ff6a5c;--be:#3f3540;--nl:#2f3d42;--uk:#2d3841;--de:#2a323a;--lu:#402f37;--bd:#6a7884}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:clamp(13px,1.05vw,22px);overflow:hidden}
.wrap{height:100%;padding:.7em;display:grid;grid-template-columns:3fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:.7em;overflow:hidden}.top{grid-column:1/3;grid-row:1}.mapc,.ac{grid-row:2}.mapc{grid-column:1}.ac{grid-column:2}.rc{grid-column:3;grid-row:1/3}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9em;padding:.8em;min-height:0}
.top{display:grid;grid-template-columns:auto 1fr;gap:.7em 1.2em;align-items:center;padding-top:1em}
h1{margin:0;font-size:1.4em;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;text-align:center}
.stat b{display:block;font-size:1.6em;line-height:1.1}
.stat span{color:var(--mute);font-size:.85em}
.prog{grid-column:1/-1}
.bar{height:.8em;background:var(--line);border-radius:.5em;overflow:hidden;margin-top:.3em}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .6s}
.pl{display:flex;justify-content:space-between;gap:1em;color:var(--mute)}
#msg{font-weight:700;color:var(--done)}
.main{display:contents}
.mapc{padding:.4em;display:flex}
svg{width:100%;height:100%;display:block;border-radius:.7em;background:var(--sea)}
.side{display:contents}
.land{fill:var(--land)}.be{fill:var(--be)}.nl{fill:var(--nl)}.uk{fill:var(--uk)}.de{fill:var(--de)}.lu{fill:var(--lu)}.bd{stroke:var(--bd);stroke-width:1.6;stroke-linejoin:round}.cn{font-size:20px;fill:var(--mute);opacity:.6;letter-spacing:3px;text-anchor:middle;font-weight:700}
.grid{stroke:var(--line);stroke-width:.6;opacity:.6}
.rem{stroke:var(--mute);stroke-width:2.5;stroke-dasharray:6 6;fill:none}
.dn{stroke:var(--done);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;font-weight:500}
.row{display:flex;gap:.3em;margin-bottom:.25em}
input,select,button{font:inherit;font-size:.88em;padding:.28em .5em;border-radius:.5em;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input{flex:1;width:100%}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;font-weight:600;flex:1}
button.g{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:400}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:.2em 0;border-bottom:1px solid var(--line)}
#log{flex:1;min-height:0;overflow-y:auto}.ac{display:flex;flex-direction:column}#stops{flex:0 1 auto}#lb{flex:none}
.rc{display:flex;flex-direction:column}
.stops{overflow-y:auto;flex:1;min-height:0}
.stops li.on{color:var(--done);font-weight:600}
.stops li.fr{color:var(--mute)}
.stops li.ly{font-weight:700}
.pr{display:flex;align-items:center;gap:1em}.pr .bar{flex:1;margin-top:0}#pl{color:var(--mute);white-space:nowrap}#msg:empty{display:none}small{color:var(--mute)}
#ov,#ov2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:9}.ovc{background:var(--card);border-radius:1em;padding:1.5em 2.2em;text-align:center;max-width:90vw}.ovc h2{font-size:2em;margin:.2em 0}.wide{width:min(800px,90vw)}#all{max-height:65vh;overflow-y:auto;text-align:left}.ovc button{margin-top:.8em;flex:none;padding:.5em 1.6em}
@media(max-width:800px){body{overflow:auto}.wrap{height:auto}.wrap{grid-template-columns:1fr;grid-template-rows:auto;overflow:visible}.top,.mapc,.ac,.rc{grid-column:1;grid-row:auto}.mapc{height:60vh}.top{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{white-space:normal}}
</style>
</head>
