<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMGS Rowathon</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#12263a;--mute:#5b6f82;--sea:#cfe6f5;--land:#e9e3d3;--line:#d3dbe3;--acc:#e4572e;--done:#1a7f5a;--be:#efe0b8;--nl:#e8d3c8;--uk:#dfe6d0;--de:#dde3ec;--lu:#ead9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#15263a;--ink:#e8eff6;--mute:#93a7ba;--sea:#12324a;--land:#2a3a44;--line:#27405a;--acc:#ff7a4d;--done:#3fcf9a;--be:#3a3a2a;--nl:#3d2f36;--uk:#2a3d38;--de:#2f3340;--lu:#3a2f40}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#15263a;--ink:#e8eff6;--mute:#93a7ba;--sea:#12324a;--land:#2a3a44;--line:#27405a;--acc:#ff7a4d;--done:#3fcf9a;--be:#3a3a2a;--nl:#3d2f36;--uk:#2a3d38;--de:#2f3340;--lu:#3a2f40}
*{box-sizing:border-box}
:root:root:root{color-scheme:dark;--bg:#1c2228;--card:#283139;--ink:#f2f4f6;--mute:#9aa6b0;--sea:#161b20;--land:#34404a;--line:#3b4751;--acc:#e31c0e;--done:#ff6a5c;--be:#3f3540;--nl:#2f3d42;--uk:#2d3841;--de:#2a323a;--lu:#402f37;--bd:#6a7884}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:clamp(13px,1.05vw,22px);overflow:hidden}
.wrap{height:100%;padding:.7em;display:grid;grid-template-columns:3fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:.7em;overflow:hidden}.top{grid-column:1/3;grid-row:1}.mapc,.ac{grid-row:2}.mapc{grid-column:1}.ac{grid-column:2}.rc{grid-column:3;grid-row:1/3}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9em;padding:.8em;min-height:0}
.top{display:grid;grid-template-columns:auto 1fr;gap:.7em 1.2em;align-items:center;padding-top:1em}
h1{margin:0;font-size:1.4em;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;text-align:center}
.stat b{display:block;font-size:1.6em;line-height:1.1}
.stat span{color:var(--mute);font-size:.85em}
.prog{grid-column:1/-1}
.bar{height:.8em;background:var(--line);border-radius:.5em;overflow:hidden;margin-top:.3em}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .6s}
.pl{display:flex;justify-content:space-between;gap:1em;color:var(--mute)}
#msg{font-weight:700;color:var(--done)}
.main{display:contents}
.mapc{padding:.4em;display:flex}
svg{width:100%;height:100%;display:block;border-radius:.7em;background:var(--sea)}
.side{display:contents}
.land{fill:var(--land)}.be{fill:var(--be)}.nl{fill:var(--nl)}.uk{fill:var(--uk)}.de{fill:var(--de)}.lu{fill:var(--lu)}.bd{stroke:var(--bd);stroke-width:1.6;stroke-linejoin:round}.cn{font-size:20px;fill:var(--mute);opacity:.6;letter-spacing:3px;text-anchor:middle;font-weight:700}
.grid{stroke:var(--line);stroke-width:.6;opacity:.6}
.rem{stroke:var(--mute);stroke-width:2.5;stroke-dasharray:6 6;fill:none}
.dn{stroke:var(--done);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;font-weight:500}
.row{display:flex;gap:.3em;margin-bottom:.25em}
input,select,button{font:inherit;font-size:.88em;padding:.28em .5em;border-radius:.5em;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input{flex:1;width:100%}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;font-weight:600;flex:1}
button.g{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:400}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:.2em 0;border-bottom:1px solid var(--line)}
#log{flex:1;min-height:0;overflow-y:auto}.ac{display:flex;flex-direction:column}#stops{flex:0 1 auto}#lb{flex:none}
.rc{display:flex;flex-direction:column}
.stops{overflow-y:auto;flex:1;min-height:0}
.stops li.on{color:var(--done);font-weight:600}
.stops li.fr{color:var(--mute)}
.stops li.ly{font-weight:700}
small{color:var(--mute)}
#ov,#ov2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:9}.ovc{background:var(--card);border-radius:1em;padding:1.5em 2.2em;text-align:center;max-width:90vw}.ovc h2{font-size:2em;margin:.2em 0}.wide{width:min(800px,90vw)}#all{max-height:65vh;overflow-y:auto;text-align:left}.ovc button{margin-top:.8em;flex:none;padding:.5em 1.6em}
@media(max-width:800px){body{overflow:auto}.wrap{height:auto}.wrap{grid-template-columns:1fr;grid-template-rows:auto;overflow:visible}.top,.mapc,.ac,.rc{grid-column:1;grid-row:auto}.mapc{height:60vh}.top{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
<div class="card top">
<h1>🚣 RMGS Rowathon</h1>
<div class="stats">
<div class="stat"><b id="tm">0</b><span>miles rowed</span></div>
<div class="stat"><b id="tk">0</b><span>kilometres</span></div>
<div class="stat"><b id="nr">0</b><span>entries</span></div>
<div class="stat"><b id="nx">–</b><span id="nxl">to next stop</span></div>
</div>
<div class="prog"><div class="pl"><span id="msg"></span><span id="pl"></span></div><div class="bar"><i id="pb"></i></div></div>
</div>
<div class="main">
<div class="card mapc"><svg id="map" viewBox="0 0 1240 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Route map"></svg></div>
<div class="side">
<div class="card ac"><b>Add distance</b>
<div class="row" style="margin-top:.4em"><input id="nm" placeholder="Name"><input id="fm" placeholder="Form" style="flex:.5"></div>
<div class="row"><input id="ds" type="number" min="0" step="any" placeholder="Distance"><select id="un"><option value="m">metres</option><option value="km">km</option><option value="mi">miles</option></select></div>
<div class="row"><button id="add">Add</button><button class="g" id="undo">Undo</button><button class="g" id="rst">Reset</button></div>
<div class="row"><button id="dl" style="display:none;background:var(--card);border:1px solid var(--acc);color:var(--ink)">⬇ Spreadsheet</button><button id="fin">🏁 Finished?</button></div>
<div id="ov"><div class="ovc"><div style="font-size:3em">🏁</div><h2 id="ovh"></h2><p id="ovd"></p><p id="ovs" class="sub"></p><button id="ovx">Close</button></div></div>
<div id="ov2"><div class="ovc wide"><h2>All scores</h2><ul id="all"></ul><button id="ov2x">Close</button></div></div>
<div class="row" style="margin:.4em 0 .2em;align-items:center"><b style="flex:1">Scores</b><button class="g" id="va" style="flex:none;padding:.2em .9em">View all</button></div>
<ul id="log"></ul>
<small>Saved on this device only.</small></div>
<div class="card rc"><b>Route</b><ul class="stops" id="stops"></ul><b style="margin-top:auto;padding-top:.6em">🏆 Leaderboard</b><ul class="stops" id="lb"></ul></div>
</div></div></div>
<script>
// Edit the route here: [name, lat, lon, country, label side (r/l/u/d)]
var WP=[["Rainham",51.36,0.61,"EN","l"],["Canterbury",51.28,1.08,"EN","r"],["Dover",51.13,1.31,"EN","l"],["Calais",50.95,1.86,"FR","r"],["Abbeville",50.10,1.83,"FR","l"],["Amiens",49.89,2.30,"FR","l"],["Beauvais",49.43,2.08,"FR","l"],["Paris",48.86,2.35,"FR","l"],["Compiègne",49.42,2.82,"FR","r"],["Saint-Quentin",49.85,3.29,"FR","r"],["Valenciennes",50.36,3.52,"FR","l"],["Mons",50.45,3.95,"BE","r"],["Brussels",50.85,4.35,"BE","r"]];
var KEY="rowathon-entries",E=[],FIN=null;
try{E=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){E=[]}
function hav(a,b){var R=3958.8,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[2]-a[2])*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
var cum=[0];for(var i=1;i<WP.length;i++)cum.push(cum[i-1]+hav(WP[i-1],WP[i]));
var TOT=cum[cum.length-1],PI=WP.findIndex(function(w){return w[0]=="Paris"}),PARIS=cum[PI];

function px(lo,la){return [(lo+3.91)*97,(52.476-la)*151.5]}

function poly(pts){return pts.map(function(p){var q=px(p[0],p[1]);return q[0].toFixed(0)+","+q[1].toFixed(0)}).join(" ")}
var GB=[[-5.7,50.05],[-4.2,50.35],[-3.5,50.3],[-3,50.7],[-2,50.6],[-1.1,50.75],[0.3,50.8],[0.8,50.9],[1.4,51.15],[1.4,51.35],[1,51.38],[0.7,51.45],[0.9,51.7],[1.3,51.8],[1.75,52.45],[1.75,52.95],[-4.5,52.95],[-4.1,52.4],[-5.1,51.75],[-3.9,51.6],[-3,51.4],[-3.5,51.2],[-4.6,51],[-5.4,50.3]];
var EU=[[-1.8,46.5],[-2.2,47.28],[-3,47.5],[-4.3,47.8],[-4.7,48.4],[-4.2,48.7],[-3,48.75],[-2,48.65],[-1.5,48.64],[-1.6,49.2],[-1.9,49.7],[-1.3,49.7],[-1.1,49.35],[-0.2,49.3],[0.1,49.5],[0.5,49.45],[1.1,49.8],[1.6,50.2],[1.6,50.7],[1.85,50.97],[2.5,51.1],[3.2,51.35],[3.6,51.45],[4,51.9],[4.2,52.1],[4.6,52.5],[4.75,52.95],[10.5,52.95],[10.5,46.5]];
function f(n){return n.toLocaleString("en-GB",{maximumFractionDigits:1})}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function draw(){
var tot=E.reduce(function(s,e){return s+e.m},0),p=pos(tot),s="";
for(var g=-5;g<=10;g++){var a=px(g,52.7);s+='<line class="grid" x1="'+a[0]+'" y1="0" x2="'+a[0]+'" y2="720"/>'}
for(var h=47;h<=53;h++){var c=px(-3,h);s+='<line class="grid" x1="0" y1="'+c[1]+'" x2="1240" y2="'+c[1]+'"/>'}
var BE=[[2.55,51.09],[3.37,51.37],[3.55,51.3],[3.9,51.2],[4.25,51.37],[4.5,51.42],[5,51.47],[5.25,51.3],[5.7,51.15],[6,50.75],[6,50.2],[5.8,49.55],[5.4,49.52],[5.2,49.7],[4.85,50.14],[4.5,49.99],[4.2,50.05],[4.1,50.28],[3.9,50.33],[3.7,50.38],[3.58,50.5],[3.2,50.55],[3.28,50.72],[3.1,50.78],[2.85,50.74],[2.6,50.95]],NL=[[3.37,51.37],[3.55,51.3],[3.9,51.2],[4.25,51.37],[4.5,51.42],[5,51.47],[5.25,51.3],[5.7,51.15],[6,51.05],[6.1,51.8],[6.8,51.9],[7,52.6],[7.2,52.95],[4.75,52.95],[4.6,52.5],[4.2,52.1],[4,51.9],[3.6,51.45]],DE=[[5.7,51.15],[6,51.05],[6.1,51.8],[6.8,51.9],[7,52.6],[7.2,52.95],[10.5,52.95],[10.5,47.35],[7.6,47.35],[8.1,48.95],[7,49.1],[6.4,49.45],[6.5,49.8],[6.2,50.18],[6,50.2],[6,50.75]],LU=[[6,50.2],[5.8,49.55],[6.4,49.45],[6.5,49.8],[6.2,50.18]],cx=function(lo,la){var q=px(lo,la);return 'x="'+q[0]+'" y="'+q[1]+'"'};
s+='<polygon class="land uk bd" points="'+poly(GB)+'"/><polygon class="land bd" points="'+poly(EU)+'"/><polygon class="be bd" points="'+poly(BE)+'"/><polygon class="nl bd" points="'+poly(NL)+'"/><polygon class="de bd" points="'+poly(DE)+'"/><polygon class="lu bd" points="'+poly(LU)+'"/>';
s+='<text class="cn" '+cx(-1.3,51.8)+'>ENGLAND</text><text class="cn" '+cx(1.5,48.1)+'>FRANCE</text><text class="cn" '+cx(4.9,50.6)+'>BELGIUM</text><text class="cn" style="font-size:14px" '+cx(5.7,52.2)+'>NETHERLANDS</text>';
var all=WP.map(function(w){return [w[2],w[1]]}),done=[],dn=Math.min(tot,TOT);
for(var i=0;i<WP.length;i++){if(cum[i]<=dn)done.push([WP[i][2],WP[i][1]])}
done.push([p[0],p[1]]);
s+='<polyline class="rem" points="'+poly(all)+'"/><polyline class="dn" points="'+poly(done)+'"/>';
WP.forEach(function(w,i){var q=px(w[2],w[1]),r=cum[i]<=tot,k=w[4],x=q[0],y=q[1]+5,a="start";
if(k=="r")x+=11;else if(k=="l"){x-=11;a="end"}else{a="middle";y=q[1]+(k=="u"?-12:20)}
s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i==PI?8:5)+'" fill="'+(r?"var(--done)":"var(--card)")+'" stroke="var(--ink)" stroke-width="2"/><text class="lbl" text-anchor="'+a+'" x="'+x+'" y="'+y+'">'+w[0]+(i==PI?" (last year)":"")+'</text>'});
var b=px(p[0],p[1]);
s+='<g transform="translate('+b[0]+','+b[1]+')"><circle r="16" fill="var(--acc)" opacity=".25"><animate attributeName="r" values="12;22;12" dur="2s" repeatCount="indefinite"/></circle><circle r="9" fill="var(--acc)" stroke="#fff" stroke-width="3"/></g>';
document.getElementById("map").innerHTML=s;
document.getElementById("tm").textContent=f(tot);
document.getElementById("tk").textContent=f(tot*1.609344);
document.getElementById("nr").textContent=E.length;
var nx=-1;for(var j=0;j<WP.length;j++){if(cum[j]>tot){nx=j;break}}
document.getElementById("nx").textContent=nx<0?"🏁":f(cum[nx]-tot);
document.getElementById("nxl").textContent=nx<0?"Brussels reached!":"miles to "+WP[nx][0];
var m="";
if(tot>=TOT)m="Bienvenue à Bruxelles! You made it! 🎉";
else if(tot>=cum[EX])m="You’ve rowed out of France and into "+EXN+"! 🇫🇷➡️🇧🇪";
else if(tot>PARIS)m="You’ve beaten last year! "+f(tot-PARIS)+" miles past Paris.";
document.getElementById("msg").textContent=FIN?"🏁 Finished: "+FIN.s:m;
document.getElementById("pl").textContent=tot<PARIS?f(PARIS-tot)+" miles to match last year’s Paris":f(Math.max(0,TOT-tot))+" miles to Brussels";
document.getElementById("pb").style.width=Math.min(100,tot/(tot<PARIS?PARIS:TOT)*100)+"%";
document.getElementById("stops").innerHTML=WP.map(function(w,i){var c=(cum[i]<=tot?"on":(w[3]=="FR"?"":"fr"))+(i==PI?" ly":"");return '<li class="'+c+'"><span>'+(cum[i]<=tot?"✓ ":"")+w[0]+' <small>'+w[3]+'</small></span><span>'+f(cum[i])+' mi</span></li>'}).join("");
var rowH=function(e,i){return '<li><span><small>#'+(i+1)+'</small> '+esc(e.n||"Anonymous")+(e.f?' <small>'+esc(e.f)+'</small>':'')+'</span><span>'+f(e.m)+' mi</span></li>'};
var rev=E.map(rowH).reverse();
document.getElementById("log").innerHTML=rev.slice(0,40).join("");
document.getElementById("all").innerHTML=rev.join("");
var lb={};E.forEach(function(e){if(!e.n)return;var k=e.n.toLowerCase()+"|"+(e.f||"").toLowerCase();lb[k]=lb[k]||{n:e.n,f:e.f,m:0};lb[k].m+=e.m});
var med=["🥇","🥈","🥉"];
document.getElementById("lb").innerHTML=Object.keys(lb).map(function(k){return lb[k]}).sort(function(a,b){return b.m-a.m}).slice(0,7).map(function(r,i){return '<li><span>'+(i+1)+'. '+esc(r.n)+(r.f?' <small>'+esc(r.f)+'</small>':'')+'</span><span>'+f(r.m)+' mi</span></li>'}).join("")||'<li><small>Add names to see the leaderboard</small></li>';
try{localStorage.setItem(KEY,JSON.stringify(E));localStorage.setItem("rowathon-fin",JSON.stringify(FIN))}catch(x){}
}
function add(){var d=parseFloat(document.getElementById("ds").value);if(!(d>0))return;var u=document.getElementById("un").value;var m=u=="m"?d/1609.344:u=="km"?d*0.621371:d;E.push({n:document.getElementById("nm").value.trim(),f:document.getElementById("fm").value.trim(),m:m,d:d,u:u,t:Date.now()});document.getElementById("ds").value="";FIN=null;draw()}
document.getElementById("add").onclick=add;
document.getElementById("ds").onkeydown=function(e){if(e.key=="Enter")add()};
document.getElementById("undo").onclick=function(){E.pop();FIN=null;draw()};
try{FIN=JSON.parse(localStorage.getItem("rowathon-fin")||"null")}catch(e){FIN=null}
var TOWNS=[["Sittingbourne",51.34,0.73],["Faversham",51.32,0.89],["Shepherdswell",51.18,1.22],["Boulogne-sur-Mer",50.73,1.61],["Le Touquet",50.52,1.59],["Montreuil",50.46,1.76],["Flixecourt",50.01,2.08],["Poix-de-Picardie",49.78,1.98],["Grandvilliers",49.66,1.93],["Méru",49.23,2.14],["L’Isle-Adam",49.11,2.23],["Saint-Denis",48.94,2.36],["Gonesse",48.99,2.45],["Senlis",49.21,2.59],["Noyon",49.58,2.99],["Ham",49.75,3.07],["Cambrai",50.18,3.23],["Denain",50.33,3.40],["Quiévrain",50.41,3.68],["Saint-Ghislain",50.45,3.82],["Soignies",50.58,4.07],["Halle",50.73,4.24]];
function where(t){
if(t<0.05)return {s:"Still at Rainham",d:"No distance rowed yet."};
if(t>=TOT-0.05)return {s:"Brussels – we made it all the way!",d:"Every stop on the route was reached."};
var p=pos(t),i=0,k;for(k=0;k<WP.length;k++){if(cum[k]<=t)i=k}
var a=WP[i],b=WP[i+1],pa=t-cum[i],pb=cum[i+1]-t,s;
if(pa<1)s="Right by "+a[0];else if(pb<1)s="Right by "+b[0];
else if(a[0]=="Dover"&&b[0]=="Calais")s="In the English Channel";
else{var best=null,bd=1e9;TOWNS.forEach(function(w){var d=hav(["",p[1],p[0]],w);if(d<bd){bd=d;best=w}});s=bd<=12?"Near "+best[0]:"Between "+a[0]+" and "+b[0]}
return {s:s,d:f(pa)+" miles past "+a[0]+" and "+f(pb)+" miles short of "+b[0]+"."}}
var fs=0,ft,fb=document.getElementById("fin");
function fr(){fs=0;fb.textContent="🏁 Finished?"}
fb.onclick=function(){clearTimeout(ft);
if(fs==0){fs=1;fb.textContent="Done rowing? Tap (1/2)"}
else if(fs==1){fs=2;fb.textContent="Really sure? (2/2)"}
else{fr();var t=E.reduce(function(s,e){return s+e.m},0);FIN=where(t);draw();
document.getElementById("ovh").textContent=FIN.s;document.getElementById("ovd").textContent=FIN.d;document.getElementById("ovs").textContent="Total rowed: "+f(t)+" miles ("+f(t*1.609344)+" km) from "+E.length+" entries";
document.getElementById("ov").style.display="flex";return}
ft=setTimeout(fr,6000)};
document.getElementById("ovx").onclick=function(){document.getElementById("ov").style.display="none"};
document.getElementById("va").onclick=function(){document.getElementById("ov2").style.display="flex"};
document.getElementById("ov2x").onclick=function(){document.getElementById("ov2").style.display="none"};
var rt;document.getElementById("rst").onclick=function(){var b=this;if(b.dataset.c){clearTimeout(rt);delete b.dataset.c;b.textContent="Reset";E=[];FIN=null;draw()}else{b.dataset.c=1;b.textContent="Sure? Tap again";rt=setTimeout(function(){delete b.dataset.c;b.textContent="Reset"},3000)}};
function q(v){v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function csv(){var run=0,K=1.609344,by={},rows=[["Time","Name","Form","Distance entered","Unit","Miles","Kilometres","Running total (miles)"]];
E.forEach(function(e){run+=e.m;var h=e.d!=null,nm=e.n||"Anonymous",k=nm.toLowerCase()+"|"+(e.f||"").toLowerCase();
